name: Apply third UI polish

on:
  push:
    branches:
      - ui/main-window-modernization
    paths:
      - ".github/workflows/ui-third-polish.yml"

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ui/main-window-modernization
          fetch-depth: 0

      - name: Apply UI changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Main window: move Flat/Grouped into the existing view/sort menu.
          replace_once(
              "src/ui/widgets/windows/w_MainWindow.hpp",
              "#include <QHostAddress>\n#include <QComboBox>\n#include <QMainWindow>",
              "#include <QHostAddress>\n#include <QMainWindow>")
          replace_once(
              "src/ui/widgets/windows/w_MainWindow.hpp",
              "    ConnectionInfoWidget *infoWidget;\n    QComboBox *connectionViewCombo = nullptr;\n    //",
              "    ConnectionInfoWidget *infoWidget;\n    //")
          replace_once(
              "src/ui/widgets/windows/w_MainWindow.hpp",
              "    DECL_ACTION(sortMenu, sortAction_SortByName_Asc);",
              "    DECL_ACTION(sortMenu, connectionViewFlatAction);\n    DECL_ACTION(sortMenu, connectionViewGroupedAction);\n    DECL_ACTION(sortMenu, sortAction_SortByName_Asc);")

          replace_once(
              "src/ui/widgets/windows/w_MainWindow.cpp",
              "#include <QClipboard>\n#include <QInputDialog>",
              "#include <QActionGroup>\n#include <QClipboard>\n#include <QInputDialog>")
          old_view = '''    modelHelper = new ConnectionListHelper(connectionTreeView);\n    connectionViewCombo = new QComboBox(leftWidget);\n    connectionViewCombo->setToolTip(tr("Choose a flat list or the traditional grouped tree"));\n    connectionViewCombo->addItem(tr("Flat"), false);\n    connectionViewCombo->addItem(tr("Grouped"), true);\n    connectionViewCombo->setCurrentIndex(GlobalConfig.uiConfig.groupedConnectionView ? 1 : 0);\n    horizontalLayout_6->insertWidget(1, connectionViewCombo);\n    modelHelper->SetGrouped(GlobalConfig.uiConfig.groupedConnectionView);\n    collapseGroupsBtn->setVisible(GlobalConfig.uiConfig.groupedConnectionView);\n    connect(connectionViewCombo, QOverload<int>::of(&QComboBox::currentIndexChanged), [this](int index) {\n        const auto grouped = connectionViewCombo->itemData(index).toBool();\n        GlobalConfig.uiConfig.groupedConnectionView = grouped;\n        modelHelper->SetGrouped(grouped);\n        collapseGroupsBtn->setVisible(grouped);\n        if (grouped && !lastConnected.isEmpty())\n            connectionTreeView->expand(modelHelper->GetGroupIndex(lastConnected.groupId));\n    });'''
          new_view = '''    modelHelper = new ConnectionListHelper(connectionTreeView);\n    modelHelper->SetGrouped(GlobalConfig.uiConfig.groupedConnectionView);\n    collapseGroupsBtn->setVisible(GlobalConfig.uiConfig.groupedConnectionView);'''
          replace_once("src/ui/widgets/windows/w_MainWindow.cpp", old_view, new_view)

          old_sort = '''    // Sort Menu\n    //\n    sortMenu->addAction(sortAction_SortByName_Asc);\n    sortMenu->addAction(sortAction_SortByName_Dsc);'''
          new_sort = '''    // View / Sort Menu\n    //\n    connectionViewFlatAction->setCheckable(true);\n    connectionViewGroupedAction->setCheckable(true);\n    auto *connectionViewActionGroup = new QActionGroup(this);\n    connectionViewActionGroup->setExclusive(true);\n    connectionViewActionGroup->addAction(connectionViewFlatAction);\n    connectionViewActionGroup->addAction(connectionViewGroupedAction);\n    connectionViewFlatAction->setChecked(!GlobalConfig.uiConfig.groupedConnectionView);\n    connectionViewGroupedAction->setChecked(GlobalConfig.uiConfig.groupedConnectionView);\n    sortMenu->addAction(connectionViewFlatAction);\n    sortMenu->addAction(connectionViewGroupedAction);\n    sortMenu->addSeparator();\n    sortMenu->addAction(sortAction_SortByName_Asc);\n    sortMenu->addAction(sortAction_SortByName_Dsc);'''
          replace_once("src/ui/widgets/windows/w_MainWindow.cpp", old_sort, new_sort)

          old_connections = '''    connect(sortAction_SortByName_Asc, &QAction::triggered, [this] { SortConnectionList(ROLE_DISPLAYNAME, true); });'''
          new_connections = '''    const auto setGroupedConnectionView = [this](bool grouped) {\n        GlobalConfig.uiConfig.groupedConnectionView = grouped;\n        modelHelper->SetGrouped(grouped);\n        collapseGroupsBtn->setVisible(grouped);\n        if (grouped && !lastConnected.isEmpty())\n            connectionTreeView->expand(modelHelper->GetGroupIndex(lastConnected.groupId));\n    };\n    connect(connectionViewFlatAction, &QAction::triggered, [setGroupedConnectionView] { setGroupedConnectionView(false); });\n    connect(connectionViewGroupedAction, &QAction::triggered, [setGroupedConnectionView] { setGroupedConnectionView(true); });\n    connect(sortAction_SortByName_Asc, &QAction::triggered, [this] { SortConnectionList(ROLE_DISPLAYNAME, true); });'''
          replace_once("src/ui/widgets/windows/w_MainWindow.cpp", old_connections, new_connections)

          # Make the normal restored footprint narrower/taller and rebalance the split.
          replace_once(
              "src/ui/widgets/windows/w_MainWindow_extra.cpp",
              '''        setMinimumSize(760, 580);\n        leftWidget->setMinimumWidth(240);\n        scrollArea->setMinimumWidth(420);\n        if (width() > 900 && width() <= 1024)\n            resize(900, qMax(height(), 620));\n        splitter->setSizes({ 250, qMax(width() - 270, 420) });''',
              '''        setMinimumSize(760, 640);\n        leftWidget->setMinimumWidth(220);\n        scrollArea->setMinimumWidth(400);\n        if (width() > 860 && width() <= 1024)\n            resize(860, qMax(height(), 720));\n        splitter->setSizes({ 230, qMax(width() - 250, 400) });''')
          replace_once(
              "src/ui/widgets/windows/w_MainWindow_extra.cpp",
              '''    sortMenu->setTitle(tr("Sort connection list."));''',
              '''    connectionViewFlatAction->setText(tr("Flat view"));\n    connectionViewGroupedAction->setText(tr("Grouped view"));\n    sortMenu->setTitle(tr("View and sort connection list."));''')

          # Connection primary action: invalid selection is disabled Connect; active connection gets distinct state styling.
          replace_once(
              "src/ui/widgets/widgets/ConnectionInfoWidget.cpp",
              '#include "utils/QvHelpers.hpp"\n',
              '#include "utils/QvHelpers.hpp"\n\n#include <QStyle>\n')
          old_action = '''void ConnectionInfoWidget::setConnectionAction(bool connected)\n{\n    // Keep the primary action text-only. The legacy start/stop SVGs do not\n    // render reliably against the maintained blue primary-button palette.\n    connectBtn->setIcon(QIcon());\n    connectBtn->setText(connected ? tr("Disconnect") : tr("Connect"));\n}\n\nvoid ConnectionInfoWidget::updateConnectionAction()\n{\n    const auto isCurrentItem = KernelInstance->CurrentConnection() == ConnectionGroupPair{ connectionId, groupId };\n    setConnectionAction(isCurrentItem);\n}'''
          new_action = '''void ConnectionInfoWidget::setConnectionAction(bool connected)\n{\n    // Keep the primary action text-only. The dynamic property lets the visual\n    // system distinguish the destructive-ish Disconnect state from Connect.\n    connectBtn->setIcon(QIcon());\n    connectBtn->setProperty("connectionActive", connected);\n    connectBtn->setText(connected ? tr("Disconnect") : tr("Connect"));\n    connectBtn->style()->unpolish(connectBtn);\n    connectBtn->style()->polish(connectBtn);\n}\n\nvoid ConnectionInfoWidget::updateConnectionAction()\n{\n    const ConnectionGroupPair selected{ connectionId, groupId };\n    const auto hasConnection = connectionId != NullConnectionId && groupId != NullGroupId && ConnectionManager->IsValidId(selected);\n    connectBtn->setEnabled(hasConnection);\n    setConnectionAction(hasConnection && ConnectionManager->IsConnected(selected));\n}'''
          replace_once("src/ui/widgets/widgets/ConnectionInfoWidget.cpp", old_action, new_action)

          # Tray settings are still functional; rename them to describe the actual asset-set switches.
          replace_once(
              "src/ui/widgets/windows/w_PreferencesWindow.cpp",
              '''    darkTrayCB->setChecked(CurrentConfig.uiConfig.useDarkTrayIcon);\n    glyphTrayCB->setChecked(CurrentConfig.uiConfig.useGlyphTrayIcon);''',
              '''    label_36->setText(tr("Dark Tray Icon Set"));\n    darkTrayCB->setToolTip(tr("Use the ui_dark tray icon artwork instead of the ui_light set. This affects only the system tray icon, not the application theme."));\n    darkTrayCB->setChecked(CurrentConfig.uiConfig.useDarkTrayIcon);\n    label_47->setText(tr("Glyph Tray Icons"));\n    glyphTrayCB->setToolTip(tr("Use the glyph-* tray icon artwork instead of the standard tray icons."));\n    glyphTrayCB->setChecked(CurrentConfig.uiConfig.useGlyphTrayIcon);''')

          # Visual state colors for Connect vs Disconnect, with disabled state explicitly gray.
          old_qss = '''QPushButton#newConnectionBtn,\nQPushButton#connectBtn {\n    color: #ffffff;\n    background: #397fbb;\n    border-color: #397fbb;\n    font-weight: 600;\n}\n\nQPushButton#newConnectionBtn:hover,\nQPushButton#connectBtn:hover {\n    background: #3273ac;\n    border-color: #3273ac;\n}\n\nQPushButton#newConnectionBtn:pressed,\nQPushButton#connectBtn:pressed {\n    background: #2c6699;\n    border-color: #2c6699;\n}'''
          new_qss = '''QPushButton#newConnectionBtn,\nQPushButton#connectBtn[connectionActive="false"] {\n    color: #ffffff;\n    background: #397fbb;\n    border-color: #397fbb;\n    font-weight: 600;\n}\n\nQPushButton#newConnectionBtn:hover,\nQPushButton#connectBtn[connectionActive="false"]:hover {\n    background: #3273ac;\n    border-color: #3273ac;\n}\n\nQPushButton#newConnectionBtn:pressed,\nQPushButton#connectBtn[connectionActive="false"]:pressed {\n    background: #2c6699;\n    border-color: #2c6699;\n}\n\nQPushButton#connectBtn[connectionActive="true"] {\n    color: #ffffff;\n    background: #b45f5f;\n    border-color: #b45f5f;\n    font-weight: 600;\n}\n\nQPushButton#connectBtn[connectionActive="true"]:hover {\n    background: #a95555;\n    border-color: #a95555;\n}\n\nQPushButton#connectBtn[connectionActive="true"]:pressed {\n    background: #984c4c;\n    border-color: #984c4c;\n}\n\nQPushButton#connectBtn:disabled {\n    color: #929298;\n    background: #e9e9ec;\n    border-color: #dedee3;\n}'''
          replace_once("assets/styles/qv2ray-modern.qss", old_qss, new_qss)
          PY

          ! grep -R "connectionViewCombo" -n src/ui/widgets/windows/w_MainWindow.cpp src/ui/widgets/windows/w_MainWindow.hpp
          grep -q 'connectionViewGroupedAction' src/ui/widgets/windows/w_MainWindow.cpp
          grep -q 'connectionActive' src/ui/widgets/widgets/ConnectionInfoWidget.cpp
          grep -q 'Dark Tray Icon Set' src/ui/widgets/windows/w_PreferencesWindow.cpp
          git diff --check

          git rm .github/workflows/ui-third-polish.yml
          git config user.name "Zhehao Wang"
          git config user.email "31388024+Zhehao-w@users.noreply.github.com"
          git add -A
          git commit -m "Refine connection controls and list view UX"
          git push origin HEAD:ui/main-window-modernization

      - name: Dispatch maintained validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run data-safety-hardening.yml --repo "$GITHUB_REPOSITORY" --ref ui/main-window-modernization
          gh workflow run vless-vision-validation.yml --repo "$GITHUB_REPOSITORY" --ref ui/main-window-modernization
          gh workflow run windows-vless-vision-package.yml --repo "$GITHUB_REPOSITORY" --ref ui/main-window-modernization
