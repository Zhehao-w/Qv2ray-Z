name: Finalize UI polish validation

on:
  push:
    branches:
      - ui/main-window-modernization
    paths:
      - ".github/workflows/ui-quiet-mode-fix.yml"

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ui/main-window-modernization
          fetch-depth: 0

      - name: Verify final UI state and self-remove
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'CurrentConfig.uiConfig.quietMode = arg1 == Qt::Checked;' src/ui/widgets/windows/w_PreferencesWindow.cpp
          grep -F 'connectBtn->setIcon(QIcon());' src/ui/widgets/widgets/ConnectionInfoWidget.cpp
          grep -F 'speedChartHolderWidget->setVisible(true);' src/ui/widgets/windows/w_MainWindow_extra.cpp
          grep -F 'masterLogBrowser->setVisible(true);' src/ui/widgets/windows/w_MainWindow_extra.cpp
          grep -F 'by Zhehao-w' src/ui/widgets/windows/w_MainWindow_extra.cpp
          grep -F 'QScrollBar::handle:vertical' assets/styles/qv2ray-modern.qss
          grep -F 'QSpinBox::up-button' assets/styles/qv2ray-modern.qss
          git diff --check
          git rm .github/workflows/ui-quiet-mode-fix.yml
          git config user.name "Zhehao Wang"
          git config user.email "31388024+Zhehao-w@users.noreply.github.com"
          git commit -m "ci: remove temporary UI polish validator"
          git push origin HEAD:ui/main-window-modernization

      - name: Dispatch maintained validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run data-safety-hardening.yml --repo "$GITHUB_REPOSITORY" --ref ui/main-window-modernization
          gh workflow run vless-vision-validation.yml --repo "$GITHUB_REPOSITORY" --ref ui/main-window-modernization
          gh workflow run windows-vless-vision-package.yml --repo "$GITHUB_REPOSITORY" --ref ui/main-window-modernization
