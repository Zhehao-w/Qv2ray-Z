name: Apply quiet mode polarity fix

on:
  push:
    branches:
      - ui/main-window-modernization
    paths:
      - ".github/workflows/ui-quiet-mode-fix.yml"

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ui/main-window-modernization
          fetch-depth: 0

      - name: Fix quiet mode polarity and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/ui/widgets/windows/w_PreferencesWindow.cpp")
          text = path.read_text(encoding="utf-8")
          old = "void PreferencesWindow::on_quietModeCB_stateChanged(int arg1)\n{\n    LOADINGCHECK\n    CurrentConfig.uiConfig.quietMode = arg1 != Qt::Checked;\n}"
          new = "void PreferencesWindow::on_quietModeCB_stateChanged(int arg1)\n{\n    LOADINGCHECK\n    CurrentConfig.uiConfig.quietMode = arg1 == Qt::Checked;\n}"
          if text.count(old) != 1:
              raise SystemExit(f"Expected one quiet-mode handler, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          git rm .github/workflows/ui-quiet-mode-fix.yml
          git config user.name "Zhehao Wang"
          git config user.email "31388024+Zhehao-w@users.noreply.github.com"
          git add src/ui/widgets/windows/w_PreferencesWindow.cpp
          git commit -m "Fix quiet mode preference polarity"
          git push origin HEAD:ui/main-window-modernization

      - name: Dispatch maintained validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run data-safety-hardening.yml --repo "$GITHUB_REPOSITORY" --ref ui/main-window-modernization
          gh workflow run vless-vision-validation.yml --repo "$GITHUB_REPOSITORY" --ref ui/main-window-modernization
          gh workflow run windows-vless-vision-package.yml --repo "$GITHUB_REPOSITORY" --ref ui/main-window-modernization
