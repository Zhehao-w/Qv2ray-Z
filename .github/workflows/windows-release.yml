name: Qv2ray-Z Windows release

on:
  push:
    tags:
      - "v*-z*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and publish Qt 5.15.2 / MSVC 14.2 package
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      _QV2RAY_BUILD_INFO_: Qv2ray-Z official Windows release
      _QV2RAY_BUILD_EXTRA_INFO_: qt5.15.2-${{ github.sha }}-windows-2022

    steps:
      - name: Check out source and recursive submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare and verify release metadata
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+-z\d+$') {
            throw "Release tag has an unsupported format: $env:GITHUB_REF_NAME"
          }

          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $sourceVersion = ((Get-Content 'makespec/VERSION' -Raw).Trim() + (Get-Content 'makespec/VERSIONSUFFIX' -Raw).Trim())
          if ($version -ne $sourceVersion) {
            throw "Release tag version $version does not match source version $sourceVersion"
          }

          $releaseNotes = "docs/release-notes/$version.md"
          if (-not (Test-Path $releaseNotes -PathType Leaf)) {
            throw "Release notes file does not exist: $releaseNotes"
          }

          git fetch origin dev --no-tags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/dev
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $env:GITHUB_REF_NAME does not point to a commit contained in dev history."
          }

          "RELEASE_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_NOTES=$releaseNotes" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Release version: $version"
          Write-Host "Release notes: $releaseNotes"
          Write-Host "Release commit is contained in dev history."

      - name: Install MSVC 14.2 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          toolset: 14.2
          arch: x64

      - name: Set up Python for pinned Qt installer
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.3'

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1 internal action
        with:
          version: 5.15.2
          arch: win64_msvc2019_64
          cache: true
          aqtversion: '==3.3.0'
          py7zrversion: '==1.0.0'

      - name: Download pinned historical Qv2ray Windows dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd libs
          ./setup-libs.sh windows x64

      - name: Locate CURL in the Windows dependency bundle
        shell: pwsh
        run: |
          $prefix = (Resolve-Path "libs/x64-windows").Path
          $header = Get-ChildItem $prefix -Recurse -File -Filter curl.h |
            Where-Object { $_.FullName -match '[\\/]curl[\\/]curl\.h$' } |
            Select-Object -First 1
          $library = Get-ChildItem $prefix -Recurse -File |
            Where-Object { $_.Name -in @('libcurl.lib', 'curl.lib') -and $_.FullName -notmatch '[\\/]debug[\\/]' } |
            Select-Object -First 1

          if (-not $header) { throw "CURL header was not found below $prefix" }
          if (-not $library) { throw "CURL import library was not found below $prefix" }

          $include = Split-Path (Split-Path $header.FullName -Parent) -Parent
          "CURL_INCLUDE_DIR=$include" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CURL_LIBRARY=$($library.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CURL include directory: $include"
          Write-Host "CURL library: $($library.FullName)"

      - name: Configure and build Qv2ray-Z Release
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$PWD/build/deployment" `
            -DQV2RAY_USE_V5_CORE=ON `
            -DCURL_INCLUDE_DIR="$env:CURL_INCLUDE_DIR" `
            -DCURL_LIBRARY="$env:CURL_LIBRARY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $deployment = (Resolve-Path "build/deployment").Path
          windeployqt --release --compiler-runtime --verbose 2 --dir "$deployment" "$deployment/qv2ray.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $legacyPluginDir = Join-Path $deployment 'plugins'
          if (Test-Path $legacyPluginDir) {
            $legacyPluginDlls = Get-ChildItem $legacyPluginDir -File -Filter 'QvPlugin-*.dll' -ErrorAction SilentlyContinue
            if ($legacyPluginDlls) {
              throw 'Release unexpectedly contains legacy Qv2ray native plugin DLLs.'
            }
          }

          $legacyTranslationDir = Join-Path $deployment 'lang'
          if (Test-Path $legacyTranslationDir) {
            $legacyTranslationBundles = Get-ChildItem $legacyTranslationDir -File -Filter '*.qm' -ErrorAction SilentlyContinue
            if ($legacyTranslationBundles) {
              throw 'Release unexpectedly contains retired Qv2ray translation bundles.'
            }
          }

      - name: Download and verify pinned official Xray Windows x64 release
        shell: pwsh
        run: |
          & ./.github/scripts/install-pinned-xray-windows.ps1

      - name: Validate TLS Vision and REALITY Vision fixtures
        shell: pwsh
        run: |
          $help = & "$env:XRAY_BIN" help 2>&1 | Out-String
          $runHelp = & "$env:XRAY_BIN" help run 2>&1 | Out-String
          $fixtures = @(
            '.github/xray-fixtures/vless-tls-vision.json',
            '.github/xray-fixtures/vless-reality-vision.json'
          )

          foreach ($fixture in $fixtures) {
            Write-Host "Validating $fixture"
            if ($help -match '(?m)(^|\s)test(\s|$)') {
              & "$env:XRAY_BIN" test -c $fixture
            } elseif ($runHelp -match '\-test') {
              & "$env:XRAY_BIN" run -test -c $fixture
            } else {
              throw 'The pinned Xray release does not advertise a supported validation interface.'
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Package Xray executable, assets, and release manifest
        shell: pwsh
        run: |
          $deployment = (Resolve-Path "build/deployment").Path
          foreach ($file in @('xray.exe', 'geoip.dat', 'geosite.dat')) {
            $source = Join-Path "$env:RUNNER_TEMP/xray/bin" $file
            if (-not (Test-Path $source)) { throw "Xray release is missing $file" }
            Copy-Item $source $deployment -Force
          }

          $releaseManifest = [ordered]@{
            schema_version = 1
            qv2ray_version = $env:RELEASE_VERSION
            qv2ray_commit = $env:GITHUB_SHA
            xray_version = $env:XRAY_VERSION
            xray_asset = $env:XRAY_ASSET
            xray_sha256 = $env:XRAY_SHA256
            qt_version = '5.15.2'
            msvc_toolset = '14.2'
            runner_image = 'windows-2022'
            component_model = 'in-process'
          }
          $releaseManifest | ConvertTo-Json | Set-Content (Join-Path $deployment 'release-manifest.json') -Encoding utf8

      - name: Smoke-test packaged Qv2ray-Z
        shell: pwsh
        run: |
          $deployment = (Resolve-Path "build/deployment").Path
          foreach ($file in @('qv2ray.exe', 'xray.exe', 'geoip.dat', 'geosite.dat', 'release-manifest.json')) {
            $packagedFile = Join-Path $deployment $file
            if (-not (Test-Path $packagedFile -PathType Leaf)) { throw "Deployment is missing $file" }
          }

          $xrayVersionOutput = & "$deployment/xray.exe" version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host $xrayVersionOutput
          $expectedXrayVersion = $env:XRAY_VERSION -replace '^v', ''
          if ($xrayVersionOutput -notmatch [regex]::Escape($expectedXrayVersion)) {
            throw "Packaged xray.exe did not report pinned version $env:XRAY_VERSION"
          }

          $qv2rayVersion = & "$deployment/qv2ray.exe" --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host $qv2rayVersion
          if ($qv2rayVersion -notmatch [regex]::Escape($env:RELEASE_VERSION)) {
            throw "qv2ray.exe did not report release version $env:RELEASE_VERSION"
          }

          $metadata = Get-Content "$deployment/release-manifest.json" -Raw | ConvertFrom-Json
          if ($metadata.qv2ray_version -ne $env:RELEASE_VERSION -or
              $metadata.qv2ray_commit -ne $env:GITHUB_SHA -or
              $metadata.xray_version -ne $env:XRAY_VERSION -or
              $metadata.xray_sha256 -ne $env:XRAY_SHA256) {
            throw 'Packaged release manifest does not match the verified build inputs.'
          }
          if ($metadata.component_model -ne 'in-process') {
            throw 'Packaged release manifest does not identify the internal component model.'
          }

      - name: Create versioned ZIP and SHA256 checksum
        shell: pwsh
        run: |
          $archiveName = "Qv2ray-Z-$env:RELEASE_VERSION-Windows-x64.zip"
          $archivePath = Join-Path $PWD $archiveName
          Compress-Archive -Path "build/deployment/*" -DestinationPath $archivePath -CompressionLevel Optimal
          if (-not (Test-Path $archivePath -PathType Leaf)) { throw "Failed to create $archiveName" }

          $hash = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Out-File "$archivePath.sha256" -Encoding ascii -NoNewline
          "RELEASE_ARCHIVE=$archiveName" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Qv2ray-Z ${{ github.ref_name }}
          body_path: ${{ env.RELEASE_NOTES }}
          files: |
            ${{ env.RELEASE_ARCHIVE }}
            ${{ env.RELEASE_ARCHIVE }}.sha256
          fail_on_unmatched_files: true
          make_latest: true
