name: VLESS Vision compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/vless-vision-validation.yml"
      - ".github/xray-fixtures/**"
      - "src/base/models/CoreObjectModels.hpp"
      - "src/core/connection/serialization/vless.cpp"
      - "src/core/kernel/V2RayKernelInteractions.cpp"
      - "src/plugins/protocols/core/OutboundHandler.*"
      - "src/plugins/protocols/ui/outbound/vless.*"
      - "src/ui/widgets/widgets/StreamSettingsWidget.*"
      - "test/**"
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/vless-vision-validation.yml"
      - ".github/xray-fixtures/**"
      - "src/base/models/CoreObjectModels.hpp"
      - "src/core/connection/serialization/vless.cpp"
      - "src/core/kernel/V2RayKernelInteractions.cpp"
      - "src/plugins/protocols/core/OutboundHandler.*"
      - "src/plugins/protocols/ui/outbound/vless.*"
      - "src/ui/widgets/widgets/StreamSettingsWidget.*"
      - "test/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xray-compatibility:
    name: Latest Xray config validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out fixtures
        uses: actions/checkout@v4

      - name: Download latest stable official Xray release
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh api repos/XTLS/Xray-core/releases/latest --jq .tag_name)"
          echo "Resolved latest stable Xray release: ${tag}"
          echo "XRAY_RELEASE=${tag}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/xray"
          gh release download "$tag" \
            --repo XTLS/Xray-core \
            --pattern Xray-linux-64.zip \
            --dir "$RUNNER_TEMP/xray"
          unzip -q "$RUNNER_TEMP/xray/Xray-linux-64.zip" -d "$RUNNER_TEMP/xray/bin"
          chmod +x "$RUNNER_TEMP/xray/bin/xray"
          echo "XRAY_BIN=$RUNNER_TEMP/xray/bin/xray" >> "$GITHUB_ENV"

      - name: Inspect Xray version, help, and validation interface
        shell: bash
        run: |
          set -euo pipefail
          "$XRAY_BIN" version
          "$XRAY_BIN" help 2>&1 | tee "$RUNNER_TEMP/xray-help.txt"
          "$XRAY_BIN" help run 2>&1 | tee "$RUNNER_TEMP/xray-run-help.txt"

          if ! grep -q -- '-test' "$RUNNER_TEMP/xray-run-help.txt"; then
            echo "::error::The downloaded Xray ${XRAY_RELEASE} help does not advertise a supported config-validation interface."
            exit 1
          fi
          echo "Validation command used by Qv2ray-Z: xray run -test -c <config>"

      - name: Assert fixture compatibility properties
        shell: bash
        run: |
          set -euo pipefail
          tls=.github/xray-fixtures/vless-tls-vision.json
          reality=.github/xray-fixtures/vless-reality-vision.json

          jq -e '.outbounds[0]
            | .protocol == "vless"
            and .settings.vnext[0].users[0].encryption == "none"
            and .settings.vnext[0].users[0].flow == "xtls-rprx-vision"
            and .streamSettings.network == "tcp"
            and .streamSettings.security == "tls"
            and (.streamSettings.tlsSettings.serverName | length > 0)
            and (.streamSettings | has("xtlsSettings") | not)' "$tls"

          jq -e '.outbounds[0]
            | .protocol == "vless"
            and .settings.vnext[0].users[0].encryption == "none"
            and .settings.vnext[0].users[0].flow == "xtls-rprx-vision"
            and .streamSettings.network == "tcp"
            and .streamSettings.security == "reality"
            and (.streamSettings.realitySettings.serverName | length > 0)
            and .streamSettings.realitySettings.fingerprint == "chrome"
            and (.streamSettings.realitySettings.password | length > 0)
            and (.streamSettings.realitySettings | has("publicKey") | not)
            and .streamSettings.realitySettings.shortId == "0123456789abcdef"
            and .streamSettings.realitySettings.spiderX == "/"' "$reality"

      - name: Validate TLS and REALITY Vision configs with Xray
        shell: bash
        run: |
          set -euo pipefail
          validate() {
            local config="$1"
            echo "::group::Validating ${config} with Xray ${XRAY_RELEASE}"
            jq . "$config"
            "$XRAY_BIN" run -test -c "$config"
            echo "::endgroup::"
          }

          validate .github/xray-fixtures/vless-tls-vision.json
          validate .github/xray-fixtures/vless-reality-vision.json

          # Generate a disposable, syntactically valid ML-DSA-65 key with the
          # same official Xray binary used for validation. Persist only the
          # public verification value in the temporary client fixture.
          verify="$($XRAY_BIN mldsa65 | awk '/^Verify: / { sub(/^Verify: /, ""); print; exit }')"
          if [[ -z "$verify" ]]; then
            echo "::error::Xray did not generate an ML-DSA-65 verification key."
            exit 1
          fi
          reality_mldsa="$RUNNER_TEMP/vless-reality-vision-mldsa65.json"
          jq --arg verify "$verify" \
            '.outbounds[0].streamSettings.realitySettings.mldsa65Verify = $verify' \
            .github/xray-fixtures/vless-reality-vision.json > "$reality_mldsa"
          jq -e --arg verify "$verify" \
            '.outbounds[0].streamSettings.realitySettings.mldsa65Verify == $verify' \
            "$reality_mldsa"
          validate "$reality_mldsa"

      - name: Verify invalid config diagnostics
        shell: bash
        run: |
          set -euo pipefail
          invalid_config="$RUNNER_TEMP/invalid-xray-config.json"
          printf '{ invalid json\n' > "$invalid_config"

          set +e
          output="$("$XRAY_BIN" run -test -c "$invalid_config" 2>&1)"
          status=$?
          set -e

          if [[ $status -eq 0 ]]; then
            echo "::error::Xray unexpectedly accepted an invalid config."
            exit 1
          fi
          if [[ -z "${output//[[:space:]]/}" ]]; then
            echo "::error::Xray returned no diagnostic for an invalid config."
            exit 1
          fi
          printf '%s\n' "$output"

      - name: Confirm removed legacy features are rejected by Xray
        shell: bash
        run: |
          set -euo pipefail
          reject() {
            local config="$1"
            local expected="$2"
            set +e
            output="$("$XRAY_BIN" run -test -c "$config" 2>&1)"
            status=$?
            set -e
            if [[ $status -eq 0 ]] || ! grep -Fq "$expected" <<< "$output"; then
              printf '%s\n' "$output"
              echo "::error::Xray did not reject ${config} with the expected diagnostic."
              exit 1
            fi
          }

          legacy_xtls="$RUNNER_TEMP/vless-legacy-xtls.json"
          jq '.outbounds[0].streamSettings.security = "xtls"
              | .outbounds[0].streamSettings.xtlsSettings = .outbounds[0].streamSettings.tlsSettings
              | del(.outbounds[0].streamSettings.tlsSettings)' \
            .github/xray-fixtures/vless-tls-vision.json > "$legacy_xtls"
          reject "$legacy_xtls" 'Legacy XTLS has been removed'

          legacy_flow="$RUNNER_TEMP/vless-legacy-flow.json"
          jq '.outbounds[0].settings.vnext[0].users[0].flow = "xtls-rprx-splice"' \
            .github/xray-fixtures/vless-reality-vision.json > "$legacy_flow"
          reject "$legacy_flow" 'flow" doesn'"'"'t support "xtls-rprx-splice"'

          allow_insecure="$RUNNER_TEMP/vless-allow-insecure.json"
          jq '.outbounds[0].streamSettings.tlsSettings.allowInsecure = true' \
            .github/xray-fixtures/vless-tls-vision.json > "$allow_insecure"
          reject "$allow_insecure" 'feature "allowInsecure" has been removed'

  qv2ray-vless-tests:
    name: Qt5 VLESS serialization tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source and recursive submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt5 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            libcurl4-openssl-dev \
            libgrpc++-dev \
            libprotobuf-dev \
            libqt5svg5-dev \
            ninja-build \
            pkg-config \
            protobuf-compiler \
            protobuf-compiler-grpc \
            qtbase5-dev \
            qttools5-dev

      - name: Configure tests with the existing Qt5 architecture
        run: |
          cmake -S . -B build -GNinja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DQV2RAY_AUTO_DEPLOY=OFF \
            -DQV2RAY_HAS_BUILTIN_THEMES=OFF \
            -DQV2RAY_HAS_SINGLEAPPLICATION=OFF \
            -DQV2RAY_QT6=OFF \
            -DQV2RAY_USE_V5_CORE=ON

      - name: Build the VLESS test target
        run: cmake --build build --target parse_vless_url --parallel 2

      - name: Run VLESS serialization tests
        run: ctest --test-dir build --output-on-failure -R '^QV2RAY_TEST_parse_vless_url$'

  source-checks:
    name: Source and UI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check committed whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff-tree --check --root HEAD
          fi

      - name: Validate Qt Designer XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = sorted(Path("src").rglob("*.ui"))
          for path in files:
              ET.parse(path)
              print(f"valid XML: {path}")
          print(f"validated {len(files)} Qt Designer files")
          PY

      - name: Verify obsolete implementation and UI entries are absent
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'xtlsSettings|allowInsecure|xtls-rprx-(direct|origin|splice)' -- \
            'src/**' ':!src/**/*.ts'; then
            echo "::error::Obsolete Xray implementation or UI entries remain."
            exit 1
          fi

          grep -Fq '<string notr="true">xtls-rprx-vision</string>' src/plugins/protocols/ui/outbound/vless.ui
          grep -Fq '<string notr="true">xtls-rprx-vision-udp443</string>' src/plugins/protocols/ui/outbound/vless.ui
          grep -Fq '<string notr="true">TLS</string>' src/ui/widgets/widgets/StreamSettingsWidget.ui
          grep -Fq '<string notr="true">REALITY</string>' src/ui/widgets/widgets/StreamSettingsWidget.ui
