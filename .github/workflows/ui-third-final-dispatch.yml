name: Final third-pass UI validation dispatcher

on:
  push:
    branches:
      - ui/main-window-modernization
    paths:
      - ".github/workflows/ui-third-final-dispatch.yml"

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ui/main-window-modernization
          fetch-depth: 0

      - name: Remove dispatcher and publish final head
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ui-third-final-dispatch.yml
          git config user.name "Zhehao Wang"
          git config user.email "31388024+Zhehao-w@users.noreply.github.com"
          git commit -m "ci: remove final third-pass dispatcher"
          git push origin HEAD:ui/main-window-modernization

      - name: Dispatch maintained validation on final head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run data-safety-hardening.yml --repo "$GITHUB_REPOSITORY" --ref ui/main-window-modernization
          gh workflow run vless-vision-validation.yml --repo "$GITHUB_REPOSITORY" --ref ui/main-window-modernization
          gh workflow run windows-vless-vision-package.yml --repo "$GITHUB_REPOSITORY" --ref ui/main-window-modernization
