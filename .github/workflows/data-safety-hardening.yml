name: Data safety hardening (manual Linux diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    name: Qt5 diagnostic regression tests
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out source and recursive submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify pinned release inputs
        run: python3 .github/scripts/verify-release-inputs.py

      - name: Install Qt5 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            libcurl4-openssl-dev \
            libgrpc++-dev \
            libprotobuf-dev \
            libqt5svg5-dev \
            ninja-build \
            pkg-config \
            protobuf-compiler \
            protobuf-compiler-grpc \
            qtbase5-dev \
            qttools5-dev

      - name: Configure
        run: |
          cmake -S . -B build -GNinja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DQV2RAY_AUTO_DEPLOY=OFF \
            -DQV2RAY_HAS_BUILTIN_THEMES=OFF \
            -DQV2RAY_USE_V5_CORE=ON

      - name: Build application and supported regression targets
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --target \
            qv2ray \
            parse_ss_url \
            parse_vmess_url \
            parse_vless_url \
            generation \
            qjsonio \
            kernel_path_resolver \
            kernel_process_lifecycle \
            threading_hygiene \
            windows_integration_safety \
            data_safety \
            connection_context_resolver \
            http_request_safety \
            crash_diagnostic_safety \
            settings_compatibility \
            --parallel 2 2>&1 | tee build.log

      - name: Upload Linux build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: data-safety-linux-build-log
          path: build.log
          if-no-files-found: error

      - name: Run supported regression tests
        run: >-
          ctest --test-dir build --output-on-failure
          -R 'QV2RAY_TEST_(parse_ss_url|parse_vmess_url|parse_vless_url|generation|qjsonio|kernel_path_resolver|kernel_process_lifecycle|threading_hygiene|windows_integration_safety|data_safety|connection_context_resolver|http_request_safety|crash_diagnostic_safety|settings_compatibility)'

      - name: Check committed whitespace
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff-tree --check --root HEAD
          fi
