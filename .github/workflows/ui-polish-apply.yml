name: Apply second-round UI polish

on:
  push:
    branches:
      - ui/main-window-modernization
    paths:
      - ".github/workflows/ui-polish-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ui/main-window-modernization
          fetch-depth: 0

      - name: Apply focused UI polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          qss = Path("assets/styles/qv2ray-modern.qss")
          text = qss.read_text(encoding="utf-8")
          old = "QMainWindow,\nQDialog {\n    background: #f5f5f7;\n}"
          new = "QMainWindow,\nQDialog {\n    background: #ffffff;\n}\n\nQWidget#centralWidget {\n    background: #ffffff;\n}"
          if text.count(old) != 1:
              raise SystemExit("window background block not unique")
          text = text.replace(old, new, 1)
          old = "    background: #ffffff;\n    border: 1px solid #e4e4e7;\n    border-radius: 9px;\n    margin-top: 12px;"
          new = "    background: #f7f7f9;\n    border: 1px solid #e4e4e7;\n    border-radius: 9px;\n    margin-top: 12px;"
          if text.count(old) < 1:
              raise SystemExit("group-box style block not found")
          text = text.replace(old, new, 1)
          old = "QMenu::item {\n    padding: 6px 24px 6px 10px;\n    border-radius: 5px;\n}"
          new = "QMenu::item {\n    padding: 7px 38px 7px 12px;\n    border-radius: 5px;\n}\n\nQMenu::separator {\n    height: 1px;\n    background: #e5e5e8;\n    margin: 4px 8px;\n}"
          if text.count(old) != 1:
              raise SystemExit("menu item style block not unique")
          text = text.replace(old, new, 1)
          old = "QFrame#mainHeaderFrame,\nQFrame#leftWidget,\nQFrame#connectionInfoFrame,\nQFrame#inspectorFrame {\n    background: #ffffff;\n    border: 1px solid #e5e5e8;\n    border-radius: 10px;\n}\n\nQFrame#mainHeaderFrame {\n    min-height: 44px;\n}"
          new = "QFrame#mainHeaderFrame {\n    min-height: 44px;\n    background: transparent;\n    border: 0;\n}\n\nQFrame#leftWidget,\nQFrame#connectionInfoFrame,\nQFrame#inspectorFrame {\n    background: #f5f5f7;\n    border: 1px solid #e3e3e7;\n    border-radius: 10px;\n}"
          if text.count(old) != 1:
              raise SystemExit("main card style block not unique")
          text = text.replace(old, new, 1)
          old = "QLabel#appSubtitleLabel {\n    color: #7a7a80;\n    padding-left: 4px;\n}"
          new = "QLabel#appSubtitleLabel {\n    color: #7a7a80;\n    padding-left: 4px;\n}\n\nQLabel#buildLabel {\n    color: #8e8e93;\n    padding-left: 6px;\n}"
          if text.count(old) != 1:
              raise SystemExit("subtitle style block not unique")
          text = text.replace(old, new, 1)
          old = "QLineEdit#connectionFilterTxt {\n    min-height: 30px;\n    background: #f7f7f9;\n    border-color: #e3e3e7;\n}"
          new = "QLineEdit#connectionFilterTxt {\n    min-height: 30px;\n    background: #ffffff;\n    border-color: #dedee3;\n}"
          if text.count(old) != 1:
              raise SystemExit("search style block not unique")
          text = text.replace(old, new, 1)
          old = "QTreeView#connectionTreeView {\n    border: 0;\n    border-radius: 0;\n    background: #ffffff;\n}"
          new = "QTreeView#connectionTreeView {\n    border: 0;\n    border-radius: 0;\n    background: transparent;\n}"
          if text.count(old) != 1:
              raise SystemExit("connection tree style block not unique")
          text = text.replace(old, new, 1)
          old = "QTextBrowser#masterLogBrowser {\n    background: #fbfbfc;"
          new = "QTextBrowser#masterLogBrowser {\n    background: #ffffff;"
          if text.count(old) != 1:
              raise SystemExit("log style block not unique")
          text = text.replace(old, new, 1)
          scroll_spin = (
              "\n\n/* Compact macOS-like scrollbars: rounded thumb, no square end buttons. */\n"
              "QScrollBar:vertical {\n    background: transparent;\n    width: 10px;\n    margin: 2px 1px;\n    border: 0;\n}\n\n"
              "QScrollBar::handle:vertical {\n    background: #c7c7cc;\n    min-height: 28px;\n    border-radius: 4px;\n}\n\n"
              "QScrollBar::handle:vertical:hover {\n    background: #aeaeb2;\n}\n\n"
              "QScrollBar::add-line:vertical,\nQScrollBar::sub-line:vertical {\n    height: 0;\n    border: 0;\n    background: transparent;\n}\n\n"
              "QScrollBar::add-page:vertical,\nQScrollBar::sub-page:vertical {\n    background: transparent;\n}\n\n"
              "QScrollBar:horizontal {\n    background: transparent;\n    height: 10px;\n    margin: 1px 2px;\n    border: 0;\n}\n\n"
              "QScrollBar::handle:horizontal {\n    background: #c7c7cc;\n    min-width: 28px;\n    border-radius: 4px;\n}\n\n"
              "QScrollBar::handle:horizontal:hover {\n    background: #aeaeb2;\n}\n\n"
              "QScrollBar::add-line:horizontal,\nQScrollBar::sub-line:horizontal {\n    width: 0;\n    border: 0;\n    background: transparent;\n}\n\n"
              "QScrollBar::add-page:horizontal,\nQScrollBar::sub-page:horizontal {\n    background: transparent;\n}\n\n"
              "QAbstractScrollArea::corner {\n    background: transparent;\n}\n\n"
              "/* Numeric fields remain keyboard/wheel editable without dated stepper chrome. */\n"
              "QSpinBox,\nQDoubleSpinBox {\n    padding-right: 7px;\n}\n\n"
              "QSpinBox::up-button,\nQSpinBox::down-button,\nQDoubleSpinBox::up-button,\nQDoubleSpinBox::down-button {\n    width: 0;\n    height: 0;\n    border: 0;\n    background: transparent;\n}\n"
          )
          marker = "\nQToolTip {"
          if text.count(marker) != 1 or "Compact macOS-like scrollbars" in text:
              raise SystemExit("scrollbar insertion marker invalid")
          text = text.replace(marker, scroll_spin + marker, 1)
          qss.write_text(text, encoding="utf-8")

          replace_once("src/ui/widgets/windows/w_MainWindow.ui", "<width>1000</width>\n    <height>720</height>", "<width>900</width>\n    <height>700</height>")
          replace_once("src/ui/widgets/windows/w_MainWindow.ui", "<width>860</width>\n    <height>620</height>", "<width>760</width>\n    <height>600</height>")
          replace_once("src/ui/widgets/windows/w_MainWindow.ui", "<width>280</width>\n         <height>0</height>", "<width>250</width>\n         <height>0</height>")
          replace_once("src/ui/widgets/windows/w_MainWindow.ui", "<width>500</width>\n         <height>0</height>", "<width>420</width>\n         <height>0</height>")
          replace_once("src/ui/widgets/windows/w_MainWindow.ui", "<width>650</width>\n          <height>760</height>", "<width>560</width>\n          <height>730</height>")
          replace_once("src/ui/widgets/windows/w_MainWindow.ui", "<width>260</width>\n           <height>0</height>", "<width>190</width>\n           <height>0</height>")

          main_ui = Path("src/ui/widgets/windows/w_MainWindow.ui")
          text = main_ui.read_text(encoding="utf-8")
          left_min = "       <property name=\"minimumSize\">\n        <size>\n         <width>250</width>\n         <height>0</height>\n        </size>\n       </property>"
          left_with_max = left_min + "\n       <property name=\"maximumSize\">\n        <size>\n         <width>320</width>\n         <height>16777215</height>\n        </size>\n       </property>"
          if text.count(left_min) != 1:
              raise SystemExit("left panel minimum-size block not unique")
          text = text.replace(left_min, left_with_max, 1)
          subtitle = "       <item>\n        <widget class=\"QLabel\" name=\"appSubtitleLabel\">\n         <property name=\"text\">\n          <string>Connections</string>\n         </property>\n        </widget>\n       </item>"
          branding = subtitle + "\n       <item>\n        <widget class=\"QLabel\" name=\"buildLabel\">\n         <property name=\"font\">\n          <font>\n           <pointsize>8</pointsize>\n          </font>\n         </property>\n         <property name=\"text\">\n          <string notr=\"true\">Version · by Zhehao-w</string>\n         </property>\n        </widget>\n       </item>"
          if text.count(subtitle) != 1:
              raise SystemExit("subtitle block not unique")
          text = text.replace(subtitle, branding, 1)
          speed_hidden = "             <widget class=\"QWidget\" name=\"speedChartHolderWidget\" native=\"true\">\n              <property name=\"visible\">\n               <bool>false</bool>\n              </property>"
          log_hidden = "             <widget class=\"QTextBrowser\" name=\"masterLogBrowser\">\n              <property name=\"visible\">\n               <bool>false</bool>\n              </property>"
          if text.count(speed_hidden) != 1 or text.count(log_hidden) != 1:
              raise SystemExit("diagnostic visibility blocks not found")
          text = text.replace(speed_hidden, speed_hidden.replace("<bool>false</bool>", "<bool>true</bool>"), 1)
          text = text.replace(log_hidden, log_hidden.replace("<bool>false</bool>", "<bool>true</bool>"), 1)
          main_ui.write_text(text, encoding="utf-8")

          replace_once("src/ui/widgets/widgets/ConnectionInfoWidget.cpp", '    connectBtn->setIcon(QIcon(connected ? QV2RAY_COLORSCHEME_FILE("stop") : QV2RAY_COLORSCHEME_FILE("start")));', '    connectBtn->setIcon(QIcon());')
          replace_once("src/ui/widgets/windows/w_PreferencesWindow.ui", "<string>Quiet Mode</string>", "<string>Status Notifications</string>")
          replace_once("src/ui/widgets/windows/w_PreferencesWindow.cpp", '    quietModeCB->setText(tr("Show connection and proxy status notifications"));\n    quietModeCB->setToolTip(tr("Errors, warnings, logs, status indicators and traffic statistics are always shown."));', '    quietModeCB->setText(tr("Enabled"));\n    quietModeCB->setToolTip(tr("Show tray notifications when connection or system proxy status changes. Errors, logs, on-screen status, and traffic statistics remain available."));')
          replace_once("src/ui/widgets/windows/w_MainWindow.cpp", "    setupUi(this);\n    addStateOptions", '    setupUi(this);\n    buildLabel->setText(QStringLiteral("%1 · by Zhehao-w").arg(QV2RAY_VERSION_STRING));\n    addStateOptions')
          replace_once("src/ui/widgets/windows/w_MainWindow.cpp", "    constexpr auto sizeRatioA = 0.382;", "    constexpr auto sizeRatioA = 0.31;")
          replace_once("src/ui/widgets/windows/w_MainWindow.cpp", "    tray_SystemProxyMenu->addAction(tray_action_SetSystemProxy);\n    tray_SystemProxyMenu->addAction(tray_action_ClearSystemProxy);\n    //\n    tray_RootMenu->addAction(tray_action_ToggleVisibility);", "    tray_SystemProxyMenu->addAction(tray_action_SetSystemProxy);\n    tray_SystemProxyMenu->addAction(tray_action_ClearSystemProxy);\n    // Keep submenu indicators clear of long labels on Windows native metrics.\n    tray_RootMenu->setMinimumWidth(190);\n    tray_BypassCNMenu->setMinimumWidth(190);\n    tray_SystemProxyMenu->setMinimumWidth(190);\n    tray_RecentConnectionsMenu->setMinimumWidth(190);\n    //\n    tray_RootMenu->addAction(tray_action_ToggleVisibility);")
          PY

          git diff --check
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("src/ui/widgets/windows/w_MainWindow.ui")
          ET.parse("src/ui/widgets/windows/w_PreferencesWindow.ui")
          print("Qt Designer XML parses successfully")
          PY

      - name: Commit UI polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/styles/qv2ray-modern.qss src/ui/widgets/widgets/ConnectionInfoWidget.cpp src/ui/widgets/windows/w_MainWindow.cpp src/ui/widgets/windows/w_MainWindow.ui src/ui/widgets/windows/w_PreferencesWindow.cpp src/ui/widgets/windows/w_PreferencesWindow.ui
          git diff --cached --stat
          git commit -m "Polish Windows UI after visual testing"
          git push origin HEAD:ui/main-window-modernization
