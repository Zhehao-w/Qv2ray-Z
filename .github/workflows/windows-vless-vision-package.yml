name: Windows authoritative package

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/windows-vless-vision-package.yml"
      - ".github/release-dependencies.json"
      - ".github/scripts/**"
      - ".github/xray-fixtures/geo-routing-*.json"
      - "src/**"
      - "test/**"
      - "assets/**"
      - "3rdparty/**"
      - "libs/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "makespec/VERSION"
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/windows-vless-vision-package.yml"
      - ".github/release-dependencies.json"
      - ".github/scripts/install-pinned-xray-windows.ps1"
      - ".github/scripts/install-pinned-geo-windows.ps1"
      - ".github/scripts/verify-release-inputs.py"
      - ".github/xray-fixtures/geo-routing-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Qt 5.15.2 / MSVC 14.2 build, tests, package
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      _QV2RAY_BUILD_INFO_: Qv2ray-Z Windows package
      _QV2RAY_BUILD_EXTRA_INFO_: qt5.15.2-${{ github.sha }}-windows-2022

    steps:
      - name: Check out source and recursive submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check committed whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff-tree --check --root HEAD
          fi

      - name: Install MSVC 14.2 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          toolset: 14.2
          arch: x64

      - name: Set up Python for pinned Qt installer
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.3'

      - name: Verify pinned release inputs
        id: verify-release-inputs
        shell: pwsh
        run: |
          $output = & python .github/scripts/verify-release-inputs.py 2>&1
          $verifyExitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath verify-release-inputs.log
          if ($verifyExitCode -ne 0) { exit $verifyExitCode }

      - name: Upload release-input verifier log on failure
        if: failure() && steps.verify-release-inputs.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-input-verifier-log
          path: verify-release-inputs.log
          if-no-files-found: error

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1 internal action
        with:
          version: 5.15.2
          arch: win64_msvc2019_64
          cache: true
          aqtversion: '==3.3.0'
          py7zrversion: '==1.0.0'

      - name: Restore pinned Windows dependency archives
        id: qv2ray-deps-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: libs/deps/downloaded
          key: qv2ray-deps-windows-x64-${{ hashFiles('.github/release-dependencies.json', 'libs/setup-libs.sh') }}

      - name: Prepare pinned historical Qv2ray Windows dependencies
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd libs
          ./setup-libs.sh windows x64

      - name: Locate CURL and runtime dependencies
        shell: pwsh
        run: |
          $prefix = (Resolve-Path "libs/x64-windows").Path
          $header = Get-ChildItem $prefix -Recurse -File -Filter curl.h |
            Where-Object { $_.FullName -match '[\\/]curl[\\/]curl\.h$' } |
            Select-Object -First 1
          $library = Get-ChildItem $prefix -Recurse -File |
            Where-Object { $_.Name -in @('libcurl.lib', 'curl.lib') -and $_.FullName -notmatch '[\\/]debug[\\/]' } |
            Select-Object -First 1
          $runtime = Join-Path $prefix "bin"

          if (-not $header) { throw "CURL header was not found below $prefix" }
          if (-not $library) { throw "CURL import library was not found below $prefix" }
          if (-not (Test-Path $runtime)) { throw "Windows runtime dependency directory was not found at $runtime" }

          $include = Split-Path (Split-Path $header.FullName -Parent) -Parent
          "CURL_INCLUDE_DIR=$include" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CURL_LIBRARY=$($library.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $runtime | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "CURL include directory: $include"
          Write-Host "CURL library: $($library.FullName)"

      - name: Configure Qv2ray-Z with regression tests
        shell: pwsh
        run: |
          $runRoutingUiSafety = ("${{ github.event_name }}" -eq "workflow_dispatch") -or ([int]"${{ github.run_attempt }}" -gt 1)
          $routingUiSafety = if ($runRoutingUiSafety) { "ON" } else { "OFF" }
          cmake -S . -B build -G Ninja `
            -DBUILD_TESTING=ON `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$PWD/build/deployment" `
            -DQV2RAY_AUTO_DEPLOY=OFF `
            -DQV2RAY_USE_V5_CORE=ON `
            -DQV2RAY_BUILD_ROUTING_UI_SAFETY="$routingUiSafety" `
            -DCURL_INCLUDE_DIR="$env:CURL_INCLUDE_DIR" `
            -DCURL_LIBRARY="$env:CURL_LIBRARY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build application and supported regression targets
        id: build-regressions
        shell: pwsh
        run: |
          cmake --build build --config Release --target qv2ray parse_ss_url parse_vmess_url parse_vless_url generation qjsonio kernel_path_resolver kernel_process_lifecycle threading_hygiene windows_integration_safety data_safety connection_context_resolver http_request_safety crash_diagnostic_safety settings_compatibility --parallel 2>&1 | Tee-Object -FilePath build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) { exit $buildExitCode }

      - name: Upload Windows build log on failure
        if: failure() && steps.build-regressions.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-authoritative-build-log
          path: build.log
          if-no-files-found: error

      - name: Build routing UI safety regression
        id: build-routing-ui-safety
        if: github.event_name == 'workflow_dispatch' || github.run_attempt > 1
        shell: pwsh
        run: |
          cmake --build build --config Release --target routing_ui_safety --parallel 2>&1 | Tee-Object -FilePath routing-ui-build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) { exit $buildExitCode }

      - name: Upload routing UI build log on failure
        if: failure() && steps.build-routing-ui-safety.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-routing-ui-build-log
          path: routing-ui-build.log
          if-no-files-found: error

      - name: Run supported regression tests
        id: run-regressions
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure -C Release -R 'QV2RAY_TEST_(parse_ss_url|parse_vmess_url|parse_vless_url|generation|qjsonio|kernel_path_resolver|kernel_process_lifecycle|threading_hygiene|windows_integration_safety|data_safety|connection_context_resolver|http_request_safety|crash_diagnostic_safety|settings_compatibility)' 2>&1 | Tee-Object -FilePath ctest.log
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) { exit $testExitCode }

      - name: Upload Windows test log on failure
        if: failure() && steps.run-regressions.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-authoritative-test-log
          path: ctest.log
          if-no-files-found: error

      - name: Run routing UI safety regression
        id: run-routing-ui-safety
        if: github.event_name == 'workflow_dispatch' || github.run_attempt > 1
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure -C Release -R '^QV2RAY_TEST_routing_ui_safety$' 2>&1 | Tee-Object -FilePath routing-ui-safety.log
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) { exit $testExitCode }

      - name: Upload routing UI test log on failure
        if: failure() && steps.run-routing-ui-safety.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-routing-ui-test-log
          path: routing-ui-safety.log
          if-no-files-found: error

      - name: Install Qv2ray-Z Release
        shell: pwsh
        run: |
          cmake --install build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $deployment = (Resolve-Path "build/deployment").Path
          windeployqt --release --compiler-runtime --no-translations --verbose 2 --dir "$deployment" "$deployment/Qv2ray-Z.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $legacyPluginDir = Join-Path $deployment 'plugins'
          if (Test-Path $legacyPluginDir) {
            $legacyPluginDlls = Get-ChildItem $legacyPluginDir -File -Filter 'QvPlugin-*.dll' -ErrorAction SilentlyContinue
            if ($legacyPluginDlls) {
              throw 'Deployment unexpectedly contains legacy Qv2ray native plugin DLLs.'
            }
          }

          $legacyLanguageDir = Join-Path $deployment 'lang'
          if (Test-Path $legacyLanguageDir) {
            $legacyLanguageFiles = Get-ChildItem $legacyLanguageDir -File -Filter '*.qm' -ErrorAction SilentlyContinue
            if ($legacyLanguageFiles) {
              throw 'Deployment unexpectedly contains retired Qv2ray translation bundles.'
            }
          }

          $qtTranslationDir = Join-Path $deployment 'translations'
          if (Test-Path $qtTranslationDir) {
            throw 'Deployment unexpectedly contains Qt translation bundles.'
          }

      - name: Download and verify pinned official Xray Windows x64 release
        shell: pwsh
        run: |
          & ./.github/scripts/install-pinned-xray-windows.ps1

      - name: Download and verify pinned Geo routing assets
        shell: pwsh
        run: |
          & ./.github/scripts/install-pinned-geo-windows.ps1

      - name: Validate pinned Geo routing fixtures with Xray
        shell: pwsh
        run: |
          $env:XRAY_LOCATION_ASSET = $env:GEO_DIR
          $fixtures = @(
            '.github/xray-fixtures/geo-routing-full.json',
            '.github/xray-fixtures/geo-routing-cn-private-ext.json'
          )
          foreach ($fixture in $fixtures) {
            Write-Host "Validating $fixture with $env:XRAY_VERSION"
            & "$env:XRAY_BIN" run -test -c $fixture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Package Xray executable, Geo assets, and build manifest
        shell: pwsh
        run: |
          $deployment = (Resolve-Path "build/deployment").Path
          Copy-Item "$env:XRAY_BIN" (Join-Path $deployment 'xray.exe') -Force
          foreach ($file in @('geoip.dat', 'geosite.dat', 'geoip-only-cn-private.dat')) {
            $source = Join-Path $env:GEO_DIR $file
            if (-not (Test-Path $source -PathType Leaf)) { throw "Verified Geo staging directory is missing $file" }
            Copy-Item $source $deployment -Force
          }

          $geoipHash = (Get-FileHash (Join-Path $deployment 'geoip.dat') -Algorithm SHA256).Hash.ToLowerInvariant()
          $geositeHash = (Get-FileHash (Join-Path $deployment 'geosite.dat') -Algorithm SHA256).Hash.ToLowerInvariant()
          $cnPrivateHash = (Get-FileHash (Join-Path $deployment 'geoip-only-cn-private.dat') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($geoipHash -ne $env:GEOIP_SHA256.ToLowerInvariant()) { throw 'Packaged geoip.dat hash does not match the pin.' }
          if ($geositeHash -ne $env:GEOSITE_SHA256.ToLowerInvariant()) { throw 'Packaged geosite.dat hash does not match the pin.' }
          if ($cnPrivateHash -ne $env:GEOIP_CN_PRIVATE_SHA256.ToLowerInvariant()) { throw 'Packaged CN/private GeoIP hash does not match the pin.' }

          $sourceVersion = (Get-Content 'makespec/VERSION' -Raw).Trim()
          $buildManifest = [ordered]@{
            schema_version = 2
            qv2ray_version = $sourceVersion
            qv2ray_commit = $env:GITHUB_SHA
            xray_version = $env:XRAY_VERSION
            xray_asset = $env:XRAY_ASSET
            xray_sha256 = $env:XRAY_SHA256
            geo_rules_source = $env:GEO_RULES_SOURCE
            geo_rules_version = $env:GEO_RULES_VERSION
            geoip_asset = $env:GEOIP_ASSET
            geoip_sha256 = $geoipHash
            geosite_asset = $env:GEOSITE_ASSET
            geosite_sha256 = $geositeHash
            geo_cn_private_source = $env:GEO_CN_PRIVATE_SOURCE
            geo_cn_private_version = $env:GEO_CN_PRIVATE_VERSION
            geoip_cn_private_asset = $env:GEOIP_CN_PRIVATE_ASSET
            geoip_cn_private_sha256 = $cnPrivateHash
            qt_version = '5.15.2'
            msvc_toolset = '14.2'
            runner_image = 'windows-2022'
            component_model = 'in-process'
          }
          $buildManifest | ConvertTo-Json | Set-Content (Join-Path $deployment 'release-manifest.json') -Encoding utf8

      - name: Smoke-test packaged Qv2ray-Z
        shell: pwsh
        run: |
          $deployment = (Resolve-Path "build/deployment").Path
          foreach ($file in @('Qv2ray-Z.exe', 'xray.exe', 'geoip.dat', 'geosite.dat', 'geoip-only-cn-private.dat', 'release-manifest.json')) {
            $packagedFile = Join-Path $deployment $file
            if (-not (Test-Path $packagedFile -PathType Leaf)) { throw "Deployment is missing $file" }
          }

          $xrayVersionOutput = & "$deployment/xray.exe" version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expectedXrayVersion = $env:XRAY_VERSION -replace '^v', ''
          if ($xrayVersionOutput -notmatch [regex]::Escape($expectedXrayVersion)) {
            throw "Packaged xray.exe did not report pinned version $env:XRAY_VERSION"
          }

          $qv2rayVersionOutput = & "$deployment/Qv2ray-Z.exe" --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = Get-Content "$deployment/release-manifest.json" -Raw | ConvertFrom-Json
          if ($qv2rayVersionOutput -notmatch [regex]::Escape($metadata.qv2ray_version)) {
            throw "Packaged Qv2ray-Z.exe did not report source version $($metadata.qv2ray_version)"
          }
          if ($metadata.schema_version -ne 2 -or
              $metadata.qv2ray_commit -ne $env:GITHUB_SHA -or
              $metadata.xray_sha256 -ne $env:XRAY_SHA256 -or
              $metadata.geo_rules_source -ne $env:GEO_RULES_SOURCE -or
              $metadata.geo_rules_version -ne $env:GEO_RULES_VERSION -or
              $metadata.geo_cn_private_source -ne $env:GEO_CN_PRIVATE_SOURCE -or
              $metadata.geo_cn_private_version -ne $env:GEO_CN_PRIVATE_VERSION) {
            throw 'Packaged build manifest does not match the verified build inputs.'
          }

          $geoipHash = (Get-FileHash "$deployment/geoip.dat" -Algorithm SHA256).Hash.ToLowerInvariant()
          $geositeHash = (Get-FileHash "$deployment/geosite.dat" -Algorithm SHA256).Hash.ToLowerInvariant()
          $cnPrivateHash = (Get-FileHash "$deployment/geoip-only-cn-private.dat" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($metadata.geoip_sha256 -ne $geoipHash -or $metadata.geoip_sha256 -ne $env:GEOIP_SHA256.ToLowerInvariant()) {
            throw 'Packaged geoip.dat does not match the release manifest and dependency pin.'
          }
          if ($metadata.geosite_sha256 -ne $geositeHash -or $metadata.geosite_sha256 -ne $env:GEOSITE_SHA256.ToLowerInvariant()) {
            throw 'Packaged geosite.dat does not match the release manifest and dependency pin.'
          }
          if ($metadata.geoip_cn_private_sha256 -ne $cnPrivateHash -or $metadata.geoip_cn_private_sha256 -ne $env:GEOIP_CN_PRIVATE_SHA256.ToLowerInvariant()) {
            throw 'Packaged CN/private GeoIP does not match the release manifest and dependency pin.'
          }
          if ($metadata.component_model -ne 'in-process') {
            throw 'Packaged build manifest does not identify the internal component model.'
          }

      - name: Upload Windows deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Qv2ray-Z-Windows-x64-Qt5.15.2-with-Xray
          path: build/deployment/
          if-no-files-found: error
