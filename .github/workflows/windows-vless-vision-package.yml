name: Windows VLESS Vision package

on:
  pull_request:
    branches:
      - dev
    paths:
      - ".github/workflows/windows-vless-vision-package.yml"
      - ".github/release-dependencies.json"
      - "src/**"
      - "test/**"
      - "libs/**"
      - "cmake/**"
      - "CMakeLists.txt"
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/windows-vless-vision-package.yml"
      - ".github/release-dependencies.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Qt 5.15.2 / MSVC 14.2
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      _QV2RAY_BUILD_INFO_: Qv2ray-Z Windows package
      _QV2RAY_BUILD_EXTRA_INFO_: qt5.15.2-${{ github.sha }}-windows-2022

    steps:
      - name: Check out source and recursive submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install MSVC 14.2 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          toolset: 14.2
          arch: x64

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: 5.15.2
          arch: win64_msvc2019_64
          cache: true

      - name: Download pinned historical Qv2ray Windows dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd libs
          ./setup-libs.sh windows x64

      - name: Locate CURL in the Windows dependency bundle
        shell: pwsh
        run: |
          $prefix = (Resolve-Path "libs/x64-windows").Path
          $header = Get-ChildItem $prefix -Recurse -File -Filter curl.h |
            Where-Object { $_.FullName -match '[\\/]curl[\\/]curl\.h$' } |
            Select-Object -First 1
          $library = Get-ChildItem $prefix -Recurse -File |
            Where-Object { $_.Name -in @('libcurl.lib', 'curl.lib') -and $_.FullName -notmatch '[\\/]debug[\\/]' } |
            Select-Object -First 1

          if (-not $header) { throw "CURL header was not found below $prefix" }
          if (-not $library) { throw "CURL import library was not found below $prefix" }

          $include = Split-Path (Split-Path $header.FullName -Parent) -Parent
          "CURL_INCLUDE_DIR=$include" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CURL_LIBRARY=$($library.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CURL include directory: $include"
          Write-Host "CURL library: $($library.FullName)"

      - name: Configure and build Qv2ray-Z Release
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$PWD/build/deployment" `
            -DQV2RAY_USE_V5_CORE=ON `
            -DQV2RAY_HAS_BUILTIN_PLUGINS=ON `
            -DCURL_INCLUDE_DIR="$env:CURL_INCLUDE_DIR" `
            -DCURL_LIBRARY="$env:CURL_LIBRARY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy Qt runtime and Qv2ray plugins
        shell: pwsh
        run: |
          $deployment = (Resolve-Path "build/deployment").Path
          windeployqt --release --compiler-runtime --verbose 2 --dir "$deployment" "$deployment/qv2ray.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $plugins = Get-ChildItem "$deployment/plugins" -File -Filter '*.dll'
          if (-not $plugins) { throw 'No Qv2ray plugin DLLs were installed.' }
          $plugins | ForEach-Object { Write-Host "Packaged plugin: $($_.Name)" }

      - name: Download and verify pinned official Xray Windows x64 release
        shell: pwsh
        run: |
          $manifest = Get-Content '.github/release-dependencies.json' -Raw | ConvertFrom-Json
          $tag = $manifest.xray.version
          $asset = $manifest.xray.assets.'windows-x64'
          if (-not $tag -or -not $asset.name -or -not $asset.sha256) {
            throw 'Pinned Xray Windows dependency metadata is incomplete.'
          }

          $xrayDir = "$env:RUNNER_TEMP/xray"
          New-Item -ItemType Directory -Force $xrayDir | Out-Null
          $archive = Join-Path $xrayDir $asset.name
          $url = "https://github.com/XTLS/Xray-core/releases/download/$tag/$($asset.name)"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = $asset.sha256.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Xray checksum mismatch: expected $expectedHash, got $actualHash"
          }

          Expand-Archive $archive "$xrayDir/bin" -Force
          "XRAY_BIN=$xrayDir/bin/xray.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "XRAY_VERSION=$tag" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "XRAY_ASSET=$($asset.name)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "XRAY_SHA256=$expectedHash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Verified pinned Xray release $tag ($($asset.name))"

      - name: Validate TLS Vision and REALITY Vision fixtures
        shell: pwsh
        run: |
          $help = & "$env:XRAY_BIN" help 2>&1 | Out-String
          $runHelp = & "$env:XRAY_BIN" help run 2>&1 | Out-String
          $fixtures = @(
            '.github/xray-fixtures/vless-tls-vision.json',
            '.github/xray-fixtures/vless-reality-vision.json'
          )

          foreach ($fixture in $fixtures) {
            Write-Host "Validating $fixture"
            if ($help -match '(?m)(^|\s)test(\s|$)') {
              & "$env:XRAY_BIN" test -c $fixture
            } elseif ($runHelp -match '\-test') {
              & "$env:XRAY_BIN" run -test -c $fixture
            } else {
              throw 'The pinned Xray release does not advertise a supported validation interface.'
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Package Xray executable, assets, and build manifest
        shell: pwsh
        run: |
          $deployment = (Resolve-Path "build/deployment").Path
          foreach ($file in @('xray.exe', 'geoip.dat', 'geosite.dat')) {
            $source = Join-Path "$env:RUNNER_TEMP/xray/bin" $file
            if (-not (Test-Path $source)) { throw "Xray release is missing $file" }
            Copy-Item $source $deployment -Force
          }

          $sourceVersion = ((Get-Content 'makespec/VERSION' -Raw).Trim() + (Get-Content 'makespec/VERSIONSUFFIX' -Raw).Trim())
          $buildManifest = [ordered]@{
            schema_version = 1
            qv2ray_version = $sourceVersion
            qv2ray_commit = $env:GITHUB_SHA
            xray_version = $env:XRAY_VERSION
            xray_asset = $env:XRAY_ASSET
            xray_sha256 = $env:XRAY_SHA256
            qt_version = '5.15.2'
            msvc_toolset = '14.2'
            runner_image = 'windows-2022'
          }
          $buildManifest | ConvertTo-Json | Set-Content (Join-Path $deployment 'release-manifest.json') -Encoding utf8

      - name: Smoke-test packaged Qv2ray-Z
        shell: pwsh
        run: |
          $deployment = (Resolve-Path "build/deployment").Path
          foreach ($file in @('qv2ray.exe', 'xray.exe', 'geoip.dat', 'geosite.dat', 'release-manifest.json')) {
            $packagedFile = Join-Path $deployment $file
            if (-not (Test-Path $packagedFile -PathType Leaf)) { throw "Deployment is missing $file" }
          }

          $xrayVersionOutput = & "$deployment/xray.exe" version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expectedXrayVersion = $env:XRAY_VERSION.TrimStart('v')
          if ($xrayVersionOutput -notmatch [regex]::Escape($expectedXrayVersion)) {
            throw "Packaged xray.exe did not report pinned version $env:XRAY_VERSION"
          }

          $qv2rayVersionOutput = & "$deployment/qv2ray.exe" --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = Get-Content "$deployment/release-manifest.json" -Raw | ConvertFrom-Json
          if ($qv2rayVersionOutput -notmatch [regex]::Escape($metadata.qv2ray_version)) {
            throw "Packaged qv2ray.exe did not report source version $($metadata.qv2ray_version)"
          }
          if ($metadata.qv2ray_commit -ne $env:GITHUB_SHA -or $metadata.xray_sha256 -ne $env:XRAY_SHA256) {
            throw 'Packaged build manifest does not match the verified build inputs.'
          }

      - name: Upload Windows deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Qv2ray-Z-Windows-x64-Qt5.15.2-with-Xray
          path: build/deployment/
          if-no-files-found: error
